<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd-Shield</title>
    <style>
        :root {
            --textcolor: rgb(255, 255, 255);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .center {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass {
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
            text-align: center;
        }

        .title {
            color: var(--textcolor);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .description {
            color: var(--textcolor);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.808);
            color: rgb(32, 32, 32);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.507);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .button:active {
            transform: translateY(0);
        }

    </style>
</head>

<body>
    <div class="center">
        <div class="glass">
            <h1 class="title">Crowd-Shield</h1>
            <p class="description">A smart event platform designed to manage crowds safely, smoothly, and efficiently.</p>
            <div class="button-container">
                <button class="button org">Proceed as an Organizer</button>
                <button class="button atnd">Proceed as an Attendee</button>
                <button class="button volntr">Proceed as a Volunteer</button>
            </div>
        </div>
    </div>
</body>

</html>
